apiVersion: apps/v1
kind: Deployment
metadata:
  name: practice-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: practice-web
  template:
    metadata:
      labels:
        app: practice-web
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: practice-web
spec:
  selector:
    app: practice-web
  ports:
    - port: 80
      targetPort: 80
